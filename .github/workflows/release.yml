name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate.py
      - id: version
        shell: bash
        run: echo "version=$(python -c 'import json; print(json.load(open(".codex-plugin/plugin.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - id: tag
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --generate-notes --title "v${{ steps.version.outputs.version }}"
      - if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          python scripts/set_applied_version.py "$version"
          branch="automation/upgrade-agentic-sdlc-v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .agentic-sdlc/config.yaml
          git commit -m "Upgrade Agentic SDLC to v$version"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Upgrade Agentic SDLC to v$version" --body "Updates this repository to its newly published Agentic SDLC release. Only the repository owner may merge."
